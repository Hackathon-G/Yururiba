<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>タイムライン | ゆるりば</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/header.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/footer.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/hamburger.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/timeline.css') }}"
    />
    <script
      src="{{ url_for('static', filename='js/hamburgerMenu.js') }}"
      defer
    ></script>
    <script
      src="{{ url_for('static', filename='js/loading.js') }}"
      defer
    ></script>
    <script
      src="{{ url_for('static', filename='js/logout.js') }}"
      defer
    ></script>
  </head>
  <body>
    <!-- 上部ナビ -->
    <header>
      <div class="header-left">
        <nav id="hamburger-nav">
          <div class="hamburger-menu">
            <div class="hamburger-icon" onclick="toggleMenu()">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="menu-links">
              <ul>
                <li>
                  <a href="{{ url_for('login_view') }}" onclick="toggleMenu()"
                    >ホーム</a
                  >
                </li>
                <li>
                  <a href="{{ url_for('home_view') }}" onclick="toggleMenu()"
                    >マイページ
                  </a>
                </li>
                <li><a href="#projects" onclick="toggleMenu()">お知らせ</a></li>
                <li><a href="#contact" onclick="toggleMenu()">設定</a></li>
                <li>
                  <a
                    href="{{ url_for('login_view') }}"
                    onclick="startLogout(event)"
                    >ログアウト</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
      <div class="menu-overview" id="logoutOverlay">
        <div class="posting-content">
          <img
            id="logoutPome"
            src="{{ url_for('static', filename='images/pome_default.png') }}"
            alt="ぽめちゃん"
          />
          <p id="logoutMessage"></p>
        </div>
      </div>
      <div id="yururiba" class="header-center">ゆるりば</div>
      <div class="header-right">
        <a href="{{ url_for('error_404_test_view') }}" class="header-btn"
          >{{ login_user_name }}</a
        >
      </div>
    </header>
    <!-- メインコンテンツ -->
    <main class="main">
      <!-- カテゴリ -->
      <!-- <nav class="category">
        <button>イラスト</button>
        <button>カメラ</button>
        <button>インテリア</button>
        <button>…</button>
      </nav> -->
      <div class="welcome-message">ようこそ、{{ login_user_name }}さん</div>
      <!-- つぶやき入力 -->
      <div class="character-left">
        <img
          class="character-image"
          id="pome"
          src="{{ url_for('static', filename='images/pome_default.png') }}"
          alt="ぽめちゃん"
        />
        <div class="post-input">
          <form action="/posts" method="post">
            <textarea
              class="post-texts"
              type="text"
              name="text"
              placeholder="(*´ω`) ゆる〜くつぶやこう"
            ></textarea>
            <button type="submit" class="post_btn">投稿</button>
          </form>
        </div>
        <!-- <div class="post-input">
          <textarea
            class="post-texts"
            type="text"
            placeholder="(*´ω`) ゆる〜くつぶやこう"
          ></textarea>
          <a class="post_btn" onclick="startPosting()">投稿</a>
        </div> -->
        <!-- 投稿中オーバーレイ -->
        <div class="menu-overview" id="postingOverlay">
          <div class="posting-content">
            <img
              id="postingPome"
              src="{{ url_for('static', filename='images/pome_default.png') }}"
              alt="ぽめちゃん"
            />
            <p id="loadingMessage">投稿中</p>
          </div>
        </div>
      </div>

      <!-- タイムライン -->
      {% if posts and posts|length > 0 %}
      <section class="timeline">
        {% for post in posts %}
        <!-- 投稿1 -->
        <article class="post">
          <div class="post-user">
            <span class="user-icon">👤</span>
            <span class="user-name">{{ post.user_name }}</span>
          </div>
          <div class="post-time">{{ post.created_at }}</div>
          <p class="post-text">{{ post.post_text }}</p>
          <div class="post-actions">
            <button type="submit">保存する</button>
          </div>
        </article>
        {% endfor %}
      </section>
      {% endif %}
    </main>
    <!-- 下部ナビ -->
    <footer>ハッカソン冬の陣 Team G</footer>
  </body>
</html>
