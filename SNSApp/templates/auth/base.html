<!-- 親テンプレートは単体でも表示できるよう、DOCTYPE宣言から全て書く -->

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ハッカソン2025 冬の陣 Gチーム" />
    <title>{% block title %}{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/button.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/header.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/footer.css') }}"
    />
    {% block styles%} {% endblock%} {% block scripts%}{% endblock%}
  </head>

  <body>
    {% block header %}
    <header>
      <div class="header-left">
        <!-- ハンバーガーメニュー -->
      </div>

      <div id="yururiba" class="header-center">ゆるりば</div>

      <div class="header-right">
        <!-- 右側のボタンなど -->
      </div>
    </header>
    {% endblock %}

    {% block content %} {% endblock %}
    <footer>ハッカソン冬の陣 Team G</footer>
  </body>
</html>
