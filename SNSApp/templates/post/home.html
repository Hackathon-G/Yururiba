<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ホーム | ゆるりば</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timeline.css') }}">
  </head>

  <body>
    <!-- ===== ヘッダー（timeline.htmlと共通） ===== -->
    <header>
      <div class="header-left">ホーム</div>
      <div id="yururiba" class="header-center">ゆるりば</div>
      <div class="header-right">マイページ</div>
    </header>

    <main class="main">

      <!-- ===== ウェルカム ===== -->
      <section class="welcome-card">
        <div class="welcome-left">
          <span class="user-icon">👤</span>
        </div>

        <div class="welcome-center">
          <p>毎日ゆるっと楽しんでくれてありがとう</p>
          <p><strong>今日で20日目だよ！</strong></p>
        </div>

        <div class="welcome-right">
          <img
            src="{{ url_for('static', filename='images/pome_happy.png') }}"
            alt="ぽめちゃん"
            class="character-image"
          />
        </div>
      </section>

      <!-- ===== 投稿 / 保存 ===== -->
      <nav class="post-tab">
        <button class="tab-active">投稿</button>
        <button>保存</button>
      </nav>

      <!-- ===== 検索 ===== -->
      <div class="search">
        <input type="text" placeholder="投稿を検索">
      </div>

      <!-- ===== カテゴリ ===== -->
      <nav class="category">
        <button>イラスト</button>
        <button>カメラ</button>
        <button>インテリア</button>
        <button>…</button>
      </nav>

      <!-- ===== スタンプ表示 ===== -->
      <div class="stamp-toggle">
        <span>スタンプ表示</span>
        <label>
          <input type="checkbox" checked>
          ON
        </label>
      </div>

      <!-- ===== タイムライン（timeline.htmlと同じ構造） ===== -->
      <section class="timeline">

        <article class="post">
          <div class="post-user">
            <span class="user-icon">👤</span>
            <span class="user-name">ユーザーA</span>
          </div>

          <p class="post-text">
            今日は有明でテニスをしてきました！
          </p>

          <div class="post-actions">
            <button>落ち着く</button>
            <button>好きです</button>
            <button>いいね！</button>
            <button>保存する</button>
          </div>
        </article>

      </section>
    </main>

    <!-- ===== フッター ===== -->
    <footer class="footer">
      <button>🏠</button>
      <button>📢</button>
      <button>✉️</button>
    </footer>
  </body>
</html>
